name: Feature Request
description: Submit suggestions for new features or improvements
title: "[Feature]"
labels: ["enhancement"]
body:
  
  - type: markdown
    attributes:
      value: |
        > Important Notice: This is a solo-maintained project and I am tied up with other priorities. So feature requests will likely not be adopted, though you are still encouraged to share your ideas. They will be kept on record and may be revisited in the future.

  
  - type: input
    id: module_name
    attributes:
      label: Affected Mod's Name
      description: Which mod will this new feature apply to?
      placeholder: e.g. Croparium, Croparium Create
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Detailed feature proposal
    validations:
      required: true

