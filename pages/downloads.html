    <!-- JavaScript -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            AOS.init({duration: 800, easing: 'ease-in-out', once: true});
            
            // 移动端/深色模式/滚动逻辑
            const mobileMenuButton = document.getElementById('mobile-menu-button');
            const mobileMenu = document.getElementById('mobile-menu');
            mobileMenuButton.addEventListener('click', () => mobileMenu.classList.toggle('hidden'));
            
            const themeToggle = document.getElementById('theme-toggle');
            const mobileThemeToggle = document.getElementById('mobile-theme-toggle');
            if (localStorage.theme === 'dark' || (!localStorage.theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            }
            function toggleTheme() {
                document.documentElement.classList.toggle('dark');
                localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
                updateLoaderImages(); // 切换主题时更新Forge图片
            }
            themeToggle.addEventListener('click', toggleTheme);
            mobileThemeToggle.addEventListener('click', toggleTheme);
            
            const header = document.querySelector('header');
            window.addEventListener('scroll', () => header.classList.toggle('shadow-md', window.scrollY > 50));

            // ========================== 核心修改：模组选择逻辑 ==========================
            // 已适配 pages/downloads.html 层级，使用相对根目录的本地路径
            const loaderImageMap = {
                fabric: { 
                    light: '../resourses/assets/icons/logo_fabric.png', 
                    dark: '../resourses/assets/icons/logo_fabric.png' 
                },
                forge: { 
                    light: '../resourses/assets/icons/logo_forge.png', 
                    dark: '../resourses/assets/icons/logo_forge_darkmode.png' 
                },
                neoforge: { 
                    light: '../resourses/assets/icons/logo_neoforge.png', 
                    dark: '../resourses/assets/icons/logo_neoforge.png' 
                },
                quilt: { 
                    light: '../resourses/assets/icons/logo_quilt.png', 
                    dark: '../resourses/assets/icons/logo_quilt.png' 
                }
            };
            // 标签翻译配置
            const tagTextMap = { alpha: '开发版', beta: '测试版', release: '发行版', recommend: '推荐版', 'latest-recommend': '最新·推荐版' };
            // 分页配置
            const PAGE_SIZE = 20;
            let currentPage = 1;
            let allVersionData = [];
            // 模组列表相关
            let modList = [];
            let currentMod = null;
            // 模组列表CSV地址
            const MOD_LIST_CSV_URL = 'https://raw.githubusercontent.com/litQA/Croparium/refs/heads/page/resourses/data/versions_list';
            // 默认模组数据（fallback）
            const DEFAULT_MOD_DATA = [
                { modId: 'cp_lib', cnName: '矿石种植工艺', enName: 'Croparium', versionCsvUrl: 'https://raw.githubusercontent.com/litQA/Croparium/refs/heads/page/resourses/data/versions/cp_lib.csv' }
            ];

            // 加载器基础配置
            const loaderPriority = ['fabric', 'forge', 'neoforge', 'quilt'];
            const loaderNameMap = { fabric: 'Fabric', forge: 'Forge', neoforge: 'NeoForge', quilt: 'Quilt' };
            // 移除原有fallbackCSV，改为动态加载

            // ========================== 模组列表相关方法 ==========================
            // 解析模组列表CSV
            function parseModListCSV(csvText) {
                const lines = csvText.trim().split('\n');
                const data = [];
                lines.forEach(line => {
                    const [modId, cnName, enName, versionCsvUrl] = line.split(',').map(item => item.trim());
                    if (modId && cnName && versionCsvUrl) {
                        data.push({ modId, cnName, enName, versionCsvUrl });
                    }
                });
                return data.length > 0 ? data : DEFAULT_MOD_DATA;
            }

            // 获取模组列表
            async function getModList() {
                try {
                    const response = await fetch(MOD_LIST_CSV_URL);
                    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                    const csvText = await response.text();
                    modList = parseModListCSV(csvText);
                } catch (error) {
                    console.error('从GitHub获取模组列表CSV失败，使用默认数据:', error);
                    modList = DEFAULT_MOD_DATA;
                }
                // 初始化下拉菜单
                renderModSelectDropdown();
                // 设置默认选中第一个模组
                currentMod = modList[0];
                updateSelectedModDisplay();
                // 加载该模组的版本数据
                loadModVersionData(currentMod.versionCsvUrl);
            }

            // 渲染模组下拉菜单
            function renderModSelectDropdown() {
                const dropdown = document.getElementById('mod-select-dropdown');
                let html = '';
                modList.forEach((mod, index) => {
                    html += `
                        <div class="apple-select-option ${index === 0 ? 'apple-select-option-active' : ''}" data-mod-index="${index}">
                            ${mod.cnName}
                        </div>
                    `;
                });
                dropdown.innerHTML = html;

                // 绑定下拉选项点击事件
                dropdown.querySelectorAll('.apple-select-option').forEach(option => {
                    option.addEventListener('click', function() {
                        const modIndex = parseInt(this.dataset.modIndex);
                        currentMod = modList[modIndex];
                        // 更新选中样式
                        dropdown.querySelectorAll('.apple-select-option').forEach(opt => {
                            opt.classList.remove('apple-select-option-active');
                        });
                        this.classList.add('apple-select-option-active');
                        // 更新显示文本
                        updateSelectedModDisplay();
                        // 加载新版本数据
                        loadModVersionData(currentMod.versionCsvUrl);
                        // 关闭下拉菜单
                        toggleModDropdown(false);
                    });
                });
            }

            // 更新选中模组的显示文本
            function updateSelectedModDisplay() {
                document.getElementById('selected-mod-name').textContent = currentMod.cnName;
            }

            // 切换模组下拉菜单显示/隐藏
            function toggleModDropdown(show) {
                const dropdown = document.getElementById('mod-select-dropdown');
                const chevron = document.querySelector('#mod-select-trigger .fa-chevron-down');
                if (show === undefined) {
                    dropdown.classList.toggle('hidden');
                    chevron.classList.toggle('rotate-180');
                } else {
                    if (show) {
                        dropdown.classList.remove('hidden');
                        chevron.classList.add('rotate-180');
                    } else {
                        dropdown.classList.add('hidden');
                        chevron.classList.remove('rotate-180');
                    }
                }
            }

            // ========================== 原有方法适配 ==========================
            // 获取加载器图片（自动适配深浅色）
            function getLoaderImage(loader) {
                const isDark = document.documentElement.classList.contains('dark');
                return loaderImageMap[loader][isDark ? 'dark' : 'light'];
            }

            // 切换主题时更新所有加载器图片
            function updateLoaderImages() {
                document.querySelectorAll('.loader-img').forEach(img => {
                    const loader = img.getAttribute('data-loader');
                    img.src = getLoaderImage(loader);
                });
            }

            // CSV解析/版本排序/数据获取
            function parseVersionCSV(csvText) {
                const lines = csvText.trim().split('\n');
                const data = [];
                lines.forEach(line => {
                    const [mcVersion, loader, releaseTime, modVersion, downloadUrl, tag] = line.split(',');
                    if (mcVersion && loader && modVersion) {
                        data.push({
                            mcVersion: mcVersion.trim(), 
                            loader: loader.trim().toLowerCase(), 
                            releaseTime: releaseTime.trim(), 
                            modVersion: modVersion.trim(), 
                            downloadUrl: downloadUrl.trim(), 
                            tag: tag?.trim().toLowerCase() || 'release'
                        });
                    }
                });
                return data;
            }
            
            // 加载模组版本数据
            async function loadModVersionData(csvUrl) {
                try {
                    const response = await fetch(csvUrl);
                    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                    const csvText = await response.text();
                    const versionData = parseVersionCSV(csvText);
                    // 重新渲染版本列表
                    renderVersionList(versionData);
                } catch (error) {
                    console.error('加载模组版本数据失败:', error);
                    // 使用原有fallback数据作为兜底
                    const fallbackCSV = `
1.20.1,forge,2026/2/5,4.8.0,https://cdn.modrinth.com/data/srNXPOFJ/versions/LGYuIGEo/cp_lib-4.8.0-build.3094-forge-1.20.1.jar,recommend
1.20.1,forge,2026/4/20,5.0.0,https://github.com/litQA/Croparium/releases/download/v5.0.0-alpha/cp_lib-5.0.0-alpha-forge-1.20.1.jar,alpha
1.20.1,forge,2026/4/26,5.0.1,https://github.com/litQA/Croparium/releases/download/v5.0.1-alpha/cp_lib-5.0.1-alpha-forge-1.20.1.jar,alpha
1.20.1,forge,2026/4/26,5.0.2,https://github.com/litQA/Croparium/releases/download/v5.0.2-alpha/cp_lib-5.0.2-alpha-forge-1.20.1.jar,alpha
1.20.1,forge,2026/4/27,5.0.3,https://github.com/litQA/Croparium/releases/download/v5.0.3-alpha/cp_lib-5.0.3-alpha-forge-1.20.1.jar,alpha
1.20.1,forge,2026/4/30,5.0.6,https://github.com/litQA/Croparium/releases/download/v5.0.6-alpha/cp_lib-5.0.6-alpha-forge-1.20.1.jar,alpha
`;
                    const versionData = parseVersionCSV(fallbackCSV);
                    renderVersionList(versionData);
                }
            }
            
            function formatVersionForSort(version) {
                return version.split('.').map(num => num.padStart(3, '0')).join('.');
            }

            // 左侧版本选择栏渲染
            function renderVersionList(data) {
                const versionList = document.getElementById('version-list');
                const groupedByMCVersion = {};
                data.forEach(item => {
                    if (!groupedByMCVersion[item.mcVersion]) groupedByMCVersion[item.mcVersion] = [];
                    if (!groupedByMCVersion[item.mcVersion].some(i => i.loader === item.loader)) {
                        groupedByMCVersion[item.mcVersion].push({mcVersion: item.mcVersion, loader: item.loader});
                    }
                });

                const sortedMCVersions = Object.keys(groupedByMCVersion).sort((a, b) => 
                    formatVersionForSort(b).localeCompare(formatVersionForSort(a))
                );

                let html = '';
                sortedMCVersions.forEach(mcVersion => {
                    const loaders = groupedByMCVersion[mcVersion].sort((a, b) => 
                        loaderPriority.indexOf(a.loader) - loaderPriority.indexOf(b.loader)
                    );
                    loaders.forEach((item, index) => {
                        const loaderFormatted = loaderNameMap[item.loader];
                        const isFirst = index === 0;
                        const versionKey = `${mcVersion}-${item.loader}`;
                        html += `
                            <div class="px-3 py-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors cursor-pointer ${isFirst ? 'version-selector-active' : ''}" data-version-key="${versionKey}">
                                <div class="flex items-center justify-between w-full">
                                    <div class="flex items-center gap-1">
                                        <img src="${getLoaderImage(item.loader)}" data-loader="${item.loader}" class="loader-img">
                                        <span>${loaderFormatted}</span>
                                    </div>
                                    <span class="font-semibold text-base">${mcVersion}</span>
                                </div>
                            </div>`;
                    });
                });
                versionList.innerHTML = html;

                // 绑定事件
                const versionItems = versionList.querySelectorAll('[data-version-key]');
                versionItems.forEach(item => {
                    item.addEventListener('click', function() {
                        versionItems.forEach(i => i.classList.remove('version-selector-active'));
                        this.classList.add('version-selector-active');
                        const [mcVersion, loader] = this.getAttribute('data-version-key').split('-');
                        currentPage = 1;
                        renderDownloadList(data, mcVersion, loader);
                    });
                });
                if (versionItems.length > 0) versionItems[0].click();
            }

            // 渲染分页控件
            function renderPagination(totalItems) {
                const pagination = document.getElementById('pagination');
                const pageInfo = document.getElementById('page-info');
                const prevBtn = document.getElementById('prev-page');
                const nextBtn = document.getElementById('next-page');
                const totalPages = Math.ceil(totalItems / PAGE_SIZE);

                if (totalPages <= 1) {
                    pagination.classList.add('hidden');
                    return;
                }
                pagination.classList.remove('hidden');
                pageInfo.textContent = `第 ${currentPage} 页 / 共 ${totalPages} 页`;
                prevBtn.disabled = currentPage === 1;
                nextBtn.disabled = currentPage === totalPages;

                prevBtn.onclick = () => { currentPage--; renderAllVersions(); };
                nextBtn.onclick = () => { currentPage++; renderAllVersions(); };
            }

            // 渲染所有版本
            function renderAllVersions() {
                const totalPages = Math.ceil(allVersionData.length / PAGE_SIZE);
                const start = (currentPage - 1) * PAGE_SIZE;
                const end = start + PAGE_SIZE;
                const paginatedData = allVersionData.slice(start, end);
                const container = document.getElementById('all-versions-list');

                let html = '';
                paginatedData.forEach(item => {
                    html += `
                        <div class="version-card" data-download-url="${item.downloadUrl}">
                            <div class="flex flex-wrap justify-between items-center">
                                <div class="flex items-center mb-2 sm:mb-0">
                                    <span class="tag tag-${item.tag} mr-3">${tagTextMap[item.tag]}</span>
                                    <span class="font-bold text-lg">${item.modVersion}</span>
                                </div>
                                <div class="text-gray-500 dark:text-gray-400 text-sm">${item.releaseTime}</div>
                            </div>
                            <div class="mt-2 flex justify-between items-center">
                                <div class="text-sm text-gray-600 dark:text-gray-300">
                                    <img src="${getLoaderImage(item.loader)}" data-loader="${item.loader}" class="loader-img">
                                    ${loaderNameMap[item.loader]} ${item.mcVersion}
                                </div>
                                <button class="text-primary hover:text-primary/80 transition-colors">
                                    <i class="fa fa-download mr-1"></i> 下载
                                </button>
                            </div>
                        </div>`;
                });
                container.innerHTML = html;

                container.querySelectorAll('.version-card').forEach(card => {
                    card.addEventListener('click', () => window.open(card.dataset.downloadUrl, '_blank'));
                });
                renderPagination(allVersionData.length);
            }

            // 渲染下载列表
            function renderDownloadList(data, targetMCVersion, targetLoader) {
                const filteredData = data.filter(item => item.mcVersion === targetMCVersion && item.loader === targetLoader);
                if (filteredData.length === 0) {
                    document.getElementById('recommend-version').classList.add('hidden');
                    document.getElementById('latest-version').classList.add('hidden');
                    document.getElementById('latest-recommend-version').classList.add('hidden');
                    document.getElementById('latest-card').innerHTML = '<p class="text-gray-500 dark:text-gray-400">暂无可用版本</p>';
                    document.getElementById('all-versions-list').innerHTML = '<p class="text-gray-500 dark:text-gray-400">暂无可用版本</p>';
                    document.getElementById('pagination').classList.add('hidden');
                    return;
                }

                const recommendVersion = filteredData.filter(item => item.tag === 'recommend').sort((a, b) => 
                    formatVersionForSort(b.modVersion).localeCompare(formatVersionForSort(a.modVersion))
                )[0];
                
                const latestVersion = filteredData.sort((a, b) => 
                    formatVersionForSort(b.modVersion).localeCompare(formatVersionForSort(a.modVersion))
                )[0];

                const isSameVersion = recommendVersion && latestVersion && 
                    recommendVersion.modVersion === latestVersion.modVersion &&
                    recommendVersion.mcVersion === latestVersion.mcVersion &&
                    recommendVersion.loader === latestVersion.loader;

                if (isSameVersion) {
                    document.getElementById('latest-recommend-version').classList.remove('hidden');
                    document.getElementById('recommend-version').classList.add('hidden');
                    document.getElementById('latest-version').classList.add('hidden');
                    
                    const latestRecommendVersion = {...latestVersion, tag: 'latest-recommend'};
                    document.getElementById('latest-recommend-card').innerHTML = renderVersionCard(latestRecommendVersion);
                    document.getElementById('latest-recommend-card').onclick = () => window.open(latestRecommendVersion.downloadUrl, '_blank');
                } else {
                    document.getElementById('latest-recommend-version').classList.add('hidden');
                    
                    if (recommendVersion) {
                        document.getElementById('recommend-version').classList.remove('hidden');
                        document.getElementById('recommend-card').innerHTML = renderVersionCard(recommendVersion);
                        document.getElementById('recommend-card').onclick = () => window.open(recommendVersion.downloadUrl, '_blank');
                    } else {
                        document.getElementById('recommend-version').classList.add('hidden');
                    }

                    document.getElementById('latest-version').classList.remove('hidden');
                    document.getElementById('latest-card').innerHTML = renderVersionCard(latestVersion);
                    document.getElementById('latest-card').onclick = () => window.open(latestVersion.downloadUrl, '_blank');
                }

                allVersionData = filteredData.sort((a, b) => 
                    formatVersionForSort(b.modVersion).localeCompare(formatVersionForSort(a.modVersion))
                );
                renderAllVersions();
            }

            // 渲染版本卡片
            function renderVersionCard(item) {
                return `
                    <div class="flex flex-col md:flex-row md:justify-between md:items-center gap-4">
                        <div>
                            <div class="flex items-center mb-2">
                                <span class="tag tag-${item.tag} ml-0 mr-3">${tagTextMap[item.tag]}</span>
                                <span class="font-bold text-xl">${item.modVersion}</span>
                            </div>
                            <div class="text-gray-600 dark:text-gray-300">
                                <img src="${getLoaderImage(item.loader)}" data-loader="${item.loader}" class="loader-img">
                                ${loaderNameMap[item.loader]} ${item.mcVersion}
                            </div>
                            <div class="text-gray-500 dark:text-gray-400 text-sm mt-1">发布时间: ${item.releaseTime}</div>
                        </div>
                        <div class="flex items-center">
                            <a href="${item.downloadUrl}" target="_blank" class="px-6 py-2 bg-primary hover:bg-primary/90 text-white font-medium rounded-full transition-all flex items-center">
                                <i class="fa fa-download mr-2"></i> 立即下载
                            </a>
                        </div>
                    </div>`;
            }

            // ========================== 初始化 ==========================
            // 绑定模组下拉菜单触发事件
            document.getElementById('mod-select-trigger').addEventListener('click', () => toggleModDropdown());
            // 点击页面其他区域关闭下拉菜单
            document.addEventListener('click', function(e) {
                const trigger = document.getElementById('mod-select-trigger');
                const dropdown = document.getElementById('mod-select-dropdown');
                if (!trigger.contains(e.target) && !dropdown.contains(e.target)) {
                    toggleModDropdown(false);
                }
            });
            // 初始化加载模组列表
            getModList();
        });
    </script>
</body>
</html>
