<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>模组下载 | Downloads</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto {
                content-visibility: auto;
            }
            .version-list-item {
                @apply px-4 py-3 cursor-pointer transition-colors duration-200 border-l-2 border-transparent hover:bg-gray-100 dark:hover:bg-gray-800;
            }
            .version-list-item.active {
                @apply bg-blue-50 dark:bg-blue-900/30 border-blue-500 dark:border-blue-400;
            }
            .card {
                @apply rounded-lg p-4 bg-white dark:bg-gray-800 shadow-sm hover:shadow-md transition-shadow duration-200;
            }
            .recommend-card {
                @apply rounded-lg p-6 bg-gradient-to-br from-blue-50 to-indigo-50 dark:from-blue-900/30 dark:to-indigo-900/30 border border-blue-200 dark:border-blue-800;
            }
        }
    </style>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#eff6ff',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                        },
                        state: {
                            alpha: '#ef4444',
                            beta: '#f97316',
                            release: '#22c55e',
                            recommend: '#3b82f6',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 text-gray-900 dark:bg-gray-900 dark:text-gray-100 min-h-screen flex flex-col">
    <!-- 顶部导航 -->
    <header class="bg-white dark:bg-gray-800 shadow-sm border-b border-gray-200 dark:border-gray-700 sticky top-0 z-10">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="text-xl font-bold">模组下载</h1>
            <button id="theme-toggle" class="p-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors">
                <svg id="theme-icon-light" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 hidden dark:block" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
                </svg>
                <svg id="theme-icon-dark" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 block dark:hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
                </svg>
            </button>
        </div>
    </header>

    <!-- 主内容区 -->
    <div class="flex flex-1 overflow-hidden">
        <!-- 左侧MC版本列表 -->
        <aside class="w-64 border-r border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 overflow-y-auto flex-shrink-0">
            <div class="p-4 font-semibold text-gray-600 dark:text-gray-300 border-b border-gray-200 dark:border-gray-700">
                Minecraft 版本
            </div>
            <div id="mc-version-list" class="divide-y divide-gray-100 dark:divide-gray-700">
                <!-- 动态加载 -->
            </div>
        </aside>

        <!-- 右侧模组下载列表 -->
        <main class="flex-1 overflow-y-auto p-6">
            <div id="download-content" class="max-w-3xl mx-auto">
                <div class="text-center py-16 text-gray-500 dark:text-gray-400">
                    <p class="text-lg">请从左侧选择一个 Minecraft 版本</p>
                </div>
            </div>
        </main>
    </div>

    <script>
        // 主题切换
        const themeToggle = document.getElementById('theme-toggle');
        const htmlElement = document.documentElement;
        
        // 初始化主题
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            htmlElement.classList.add('dark');
        } else {
            htmlElement.classList.remove('dark');
        }
        
        themeToggle.addEventListener('click', () => {
            htmlElement.classList.toggle('dark');
            localStorage.theme = htmlElement.classList.contains('dark') ? 'dark' : 'light';
        });

        // 全局变量存储数据
        let modData = {};
        let selectedMcVersion = null;

        // 解析CSV文件
        async function loadVersionsCSV() {
            try {
                const response = await fetch('https://raw.githubusercontent.com/litQA/Croparium/page/src/data/versions.csv');
                if (!response.ok) throw new Error('无法加载');
                
                const csvText = await response.text();
                parseCSV(csvText);
                renderMcVersionList();
            } catch (error) {
                console.error('加载版本数据失败:', error);
                document.getElementById('download-content').innerHTML = `
                    <div class="text-center py-16 text-red-500 dark:text-red-400">
                        <p class="text-lg">加载版本数据失败，请检查网络连接或文件路径</p>
                    </div>
                `;
            }
        }

        // 解析CSV数据
        function parseCSV(csvText) {
            const lines = csvText.trim().split('\n');
            const headers = lines[0].split(',').map(h => h.trim());
            
            // 索引映射
            const mcVersionIndex = headers.indexOf('mc版本');
            const releaseDateIndex = headers.indexOf('发布时间');
            const modVersionIndex = headers.indexOf('模组版本');
            const downloadUrlIndex = headers.indexOf('下载链接');
            const statusIndex = headers.indexOf('状态');
            
            // 按MC版本分组
            lines.slice(1).forEach(line => {
                const values = line.split(',').map(v => v.trim());
                if (values.length < 5) return;
                
                const mcVersion = values[mcVersionIndex];
                const releaseDate = values[releaseDateIndex];
                const modVersion = values[modVersionIndex];
                const downloadUrl = values[downloadUrlIndex];
                const status = values[statusIndex];
                
                if (!modData[mcVersion]) {
                    modData[mcVersion] = [];
                }
                
                modData[mcVersion].push({
                    mcVersion,
                    releaseDate,
                    modVersion,
                    downloadUrl,
                    status
                });
            });
        }

        // 渲染MC版本列表
        function renderMcVersionList() {
            const listContainer = document.getElementById('mc-version-list');
            listContainer.innerHTML = '';
            
            // 按MC版本降序排序
            const sortedVersions = Object.keys(modData).sort((a, b) => {
                return parseFloat(b.replace(/\D/g, '')) - parseFloat(a.replace(/\D/g, ''));
            });
            
            sortedVersions.forEach(version => {
                const item = document.createElement('div');
                item.className = 'version-list-item';
                item.textContent = version;
                item.dataset.version = version;
                
                item.addEventListener('click', () => {
                    selectMcVersion(version);
                });
                
                listContainer.appendChild(item);
            });
        }

        // 选择MC版本
        function selectMcVersion(version) {
            selectedMcVersion = version;
            
            // 更新选中状态
            document.querySelectorAll('.version-list-item').forEach(item => {
                item.classList.toggle('active', item.dataset.version === version);
            });
            
            // 渲染下载内容
            renderDownloadContent(version);
        }

        // 渲染下载内容
        function renderDownloadContent(mcVersion) {
            const contentContainer = document.getElementById('download-content');
            const versions = modData[mcVersion];
            
            if (!versions || versions.length === 0) {
                contentContainer.innerHTML = `
                    <div class="text-center py-16 text-gray-500 dark:text-gray-400">
                        <p class="text-lg">该版本暂无模组</p>
                    </div>
                `;
                return;
            }
            
            // 分离推荐版本和其他版本
            const recommendVersion = versions.find(v => v.status === 'recommend');
            const otherVersions = versions.filter(v => v.status !== 'recommend');
            
            // 按模组版本降序排序
            otherVersions.sort((a, b) => {
                return b.modVersion.localeCompare(a.modVersion, undefined, { numeric: true, sensitivity: 'base' });
            });
            
            // 构建HTML
            let html = `<h2 class="text-2xl font-bold mb-6">Minecraft ${mcVersion}</h2>`;
            
            // 推荐版本卡片
            if (recommendVersion) {
                html += `
                    <div class="recommend-card mb-8">
                        <div class="flex items-center justify-between mb-4">
                            <div>
                                <span class="inline-block px-2 py-1 text-xs font-semibold rounded bg-state-recommend text-white mb-2">推荐版本</span>
                                <h3 class="text-xl font-bold">模组 v${recommendVersion.modVersion}</h3>
                                <p class="text-gray-600 dark:text-gray-300 text-sm mt-1">发布时间: ${recommendVersion.releaseDate}</p>
                            </div>
                            <a href="${recommendVersion.downloadUrl}" target="_blank" class="px-4 py-2 bg-primary-600 hover:bg-primary-700 text-white rounded-md transition-colors">
                                下载
                            </a>
                        </div>
                    </div>
                `;
            }
            
            // 其他版本列表
            if (otherVersions.length > 0) {
                html += `<h3 class="text-lg font-semibold mb-4">历史版本</h3><div class="space-y-3">`;
                
                otherVersions.forEach(version => {
                    const statusColor = {
                        'alpha': 'state-alpha',
                        'beta': 'state-beta',
                        'release': 'state-release'
                    }[version.status] || 'gray-500';
                    
                    const statusText = {
                        'alpha': 'Alpha',
                        'beta': 'Beta',
                        'release': 'Release'
                    }[version.status] || version.status;
                    
                    html += `
                        <div class="card flex items-center justify-between">
                            <div>
                                <span class="inline-block px-2 py-0.5 text-xs font-medium rounded bg-${statusColor}/10 text-${statusColor} mr-2">${statusText}</span>
                                <span class="font-medium">v${version.modVersion}</span>
                                <span class="text-gray-500 dark:text-gray-400 text-sm ml-4">${version.releaseDate}</span>
                            </div>
                            <a href="${version.downloadUrl}" target="_blank" class="text-primary-600 hover:text-primary-700 dark:text-primary-400 dark:hover:text-primary-300 font-medium">
                                下载
                            </a>
                        </div>
                    `;
                });
                
                html += `</div>`;
            }
            
            contentContainer.innerHTML = html;
        }

        // 页面加载完成后执行
        document.addEventListener('DOMContentLoaded', loadVersionsCSV);
    </script>
</body>
</html>
